<nav class="navbar">
  <button class="navbar__menu" (click)="onMenuToggle()" aria-label="Menu">
    <svg width="22" height="14" viewBox="0 0 22 14" fill="none">
      <path d="M1 1H21" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M1 7H21" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M1 13H21" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <a class="navbar__brand" routerLink="/gender-selection">MAISON SCENTS</a>

  <div class="navbar__actions">
    <a class="navbar__icon" routerLink="/storefront" aria-label="Wishlist">
      <svg width="20" height="18" viewBox="0 0 20 18" fill="none">
        <path d="M10 17.5C10 17.5 1 12 1 6C1 3.23858 3.23858 1 6 1C7.74 1 9.26 1.93 10 3.33C10.74 1.93 12.26 1 14 1C16.7614 1 19 3.23858 19 6C19 12 10 17.5 10 17.5Z" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <a class="navbar__icon navbar__cart" routerLink="/cart" aria-label="Cart" [class.bounce]="cartBounce">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M5 1L1 5V17C1 17.5304 1.21071 18.0391 1.58579 18.4142C1.96086 18.7893 2.46957 19 3 19H17C17.5304 19 18.0391 18.7893 18.4142 18.4142C18.7893 18.0391 19 17.5304 19 17V5L15 1H5Z" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1 5H19" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M14 9C14 10.0609 13.5786 11.0783 12.8284 11.8284C12.0783 12.5786 11.0609 13 10 13C8.93913 13 7.92172 12.5786 7.17157 11.8284C6.42143 11.0783 6 10.0609 6 9" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      @if (cart.totalItems() > 0) {
        <span class="navbar__badge">{{ cart.totalItems() }}</span>
      }
    </a>
  </div>
</nav>
