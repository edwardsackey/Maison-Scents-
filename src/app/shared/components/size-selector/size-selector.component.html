<div class="sizes">
  @for (size of sizes(); track size.ml) {
    <button class="sizes__pill"
            [class.active]="selected() === size.ml"
            [class.unavailable]="!size.available"
            [disabled]="!size.available"
            (click)="selectSize(size)">
      <span class="sizes__ml">{{ size.ml }}ml</span>
      @if (!size.available) {
        <span class="sizes__out">Unavailable</span>
      }
    </button>
  }
</div>
