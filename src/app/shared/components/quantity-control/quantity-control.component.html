<div class="qty">
  <button class="qty__btn" (click)="decrement()" [disabled]="quantity() <= 1" aria-label="Decrease quantity">
    <svg width="12" height="2" viewBox="0 0 12 2" fill="none">
      <path d="M1 1H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="qty__value">{{ quantity() }}</span>
  <button class="qty__btn" (click)="increment()" aria-label="Increase quantity">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M6 1V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M1 6H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
</div>
