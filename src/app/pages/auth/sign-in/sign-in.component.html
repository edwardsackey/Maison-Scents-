<div class="auth">
  <div class="auth__card">
    <h1 class="auth__brand">MAISON SCENTS</h1>
    <p class="auth__tagline">Enter Email for notifications receipts</p>

    <div class="auth__divider"></div>

    <form class="auth__form" (ngSubmit)="onSubmit()">
      <div class="auth__field">
        <input type="email"
               class="auth__input"
               placeholder="Enter Email"
               [(ngModel)]="email"
               name="email"
               required>
      </div>

      <button type="submit"
              class="auth__submit"
              [disabled]="loading()">
        {{ loading() ? 'LOADING...' : 'DONE' }}
      </button>
    </form>

    <p class="auth__footer">
      Don't have an account?
      <a routerLink="/auth/sign-up" class="auth__link">Sign Up</a>
    </p>
  </div>
</div>
