<div class="auth">
  <button class="auth__skip" routerLink="/gender-selection">
    Skip
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/>
      <path d="M12 5l7 7-7 7"/>
    </svg>
  </button>
  <div class="auth__card">
    <h1 class="auth__brand">MAISON SCENTS</h1>
    <p class="auth__tagline">Sign Up to receive our newsletters</p>

    <div class="auth__divider"></div>

    <form class="auth__form" (ngSubmit)="onSubmit()">
      <div class="auth__field">
        <input type="email"
               class="auth__input"
               placeholder="Enter Email"
               [(ngModel)]="email"
               name="email"
               required>
      </div>

      <div class="auth__field auth__field--password">
        <input [type]="showPassword() ? 'text' : 'password'"
               class="auth__input"
               placeholder="Password"
               [(ngModel)]="password"
               name="password"
               required>
        <button type="button" class="auth__eye" (click)="togglePassword()" aria-label="Toggle password visibility">
          @if (showPassword()) {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          }
        </button>
      </div>

      @if (auth.authError()) {
        <p class="auth__error">{{ auth.authError() }}</p>
      }

      <button type="submit"
              class="auth__submit"
              [disabled]="loading()">
        {{ loading() ? 'SIGNING IN...' : 'SIGN IN' }}
      </button>
    </form>

    <div class="auth__separator">
      <span class="auth__separator-line"></span>
      <span class="auth__separator-text">or</span>
      <span class="auth__separator-line"></span>
    </div>

    <div class="auth__social">
      <button class="auth__social-btn" (click)="onSocialLogin('google')">
        <svg class="auth__social-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

    </div>

    <p class="auth__footer">
      Don't have an account?
      <a routerLink="/auth/sign-up" class="auth__link">Sign Up</a>
    </p>
  </div>
</div>
